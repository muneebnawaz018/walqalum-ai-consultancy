   Routing does NOT depend on the hash actually changing. Some embedded
   viewers sandbox the frame such that location.hash writes are ignored or
   throw, which is why the nav appeared dead outside a normal browser. Every
   internal link is intercepted, state is held in memory, and the URL is only
   updated on a best-effort basis.
   ========================================================================== */

let destroyHero = null;
let STATE = { lang: "en", route: "home", param: null };

function parsePath(path) {
  const parts = String(path || "").replace(/^#/, "").split("/").filter(Boolean);
  let lang = "en";
  if (parts[0] === "en" || parts[0] === "ar") lang = parts.shift();
  return { lang, route: parts[0] || "home", param: parts[1] || null };
}

function pathOf(st) {
  return `/${st.lang}/${st.route === "home" ? "" : st.route + (st.param ? "/" + st.param : "")}`;
}

function syncUrl() {
  const p = pathOf(STATE);
  try {
    history.replaceState(null, "", "#" + p);
    return;
  } catch (_) { /* file:// or sandboxed */ }
  try { location.hash = p; } catch (_) { /* give up quietly — nav still works */ }
}

function navigate(path, { push = true } = {}) {
  STATE = parsePath(path);
  LANG = STATE.lang;
  if (push) syncUrl();
  render();
  try { window.scrollTo(0, 0); } catch (_) {}
}

/* Old mockup routes stay alive so any link already shared keeps working. */
const ROUTE_ALIAS = {
  firm: "about-us",
  work: "our-work",
  insights: "blog",
  partners: "our-client",
  careers: "life-walqalum",
  privacy: "privacy-policy",
  terms: "term-and-condition",
  "contact-us": "contact",
  // the live site ships this slug with a capital I and a missing "s"
  "it-Infrastructure-and-cloud-ervices": "it-infrastructure-and-cloud",
};

function view() {
  const { param } = STATE;
  const route = ROUTE_ALIAS[STATE.route] || STATE.route;
  switch (route) {
    case "home": return V.home();
    case "services": {
      if (!param) return V.services();
      const slug = ROUTE_ALIAS[param] || param;
      // /services/<slug> serves both the four practices and the eight
      // capability pages, exactly as the live site does.
      if (C.practices.some((x) => x.slug === slug)) return V.service(slug);
      if ((C.capabilities || []).some((x) => x.slug === slug)) return V.capability(slug);
      return V.notfound();
    }
    case "engagements": return V.engagements();
    case "industries": return V.industries();
    case "our-work": return param ? V.case(param) : V.work();
    case "blog": return param ? V.post(param) : V.insights();
    case "about-us": return V.firm();
    case "capabilities": return V.capabilities();
    case "our-client": return V.partners();
    case "life-walqalum": return V.careers();
    case "privacy-policy": return V.legal("privacy");
    case "term-and-condition": return V.legal("terms");
    case "contact": return V.contact();
    default: return V.notfound();
  }
}

function render() {
  LANG = STATE.lang;
  document.documentElement.lang = LANG;
  document.documentElement.dir = isRTL() ? "rtl" : "ltr";

  if (destroyHero) { destroyHero(); destroyHero = null; }

  renderChrome(ROUTE_ALIAS[STATE.route] || STATE.route);
  document.getElementById("main").innerHTML = view();

  document.querySelector(".mock-note").textContent =
    LANG === "ar" ? "نموذج أولي · الصور عناصر مؤقتة" : "Mockup · images are placeholders";

  bindChrome();
  observeReveals();
  mountHero();
  mountForm();
}

function mountHero() {
  const canvas = document.getElementById("hero-canvas");
  if (!canvas) return;
  const fallback = document.querySelector(".hero-fallback");
  const fail = () => { canvas.style.display = "none"; if (fallback) fallback.classList.add("show"); };
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return fail();
  try {
    const r = initHero(canvas, {
      rtl: isRTL(),
      low: window.matchMedia("(pointer: coarse)").matches || innerWidth < 900,
    });
    if (!r) return fail();
    destroyHero = typeof r === "function" ? r : null;
  } catch (e) {
    console.error(e);
    fail();
  }
}

function mountForm() {
  const form = document.getElementById("contact-form");
  if (!form) return;
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!form.checkValidity()) return form.reportValidity();
    form.querySelector(".form-msg").hidden = false;
    form.querySelector('button[type="submit"]').disabled = true;
  });
}

function bindChrome() {
  const header = document.querySelector(".site-header");
  const onScroll = () => header.classList.toggle("scrolled", scrollY > 16);
  onScroll();
  if (window.__wqScroll) window.removeEventListener("scroll", window.__wqScroll);
  window.__wqScroll = onScroll;
  window.addEventListener("scroll", onScroll, { passive: true });

  // The mega menu opens on hover for a mouse, and on click for touch and
  // keyboard. Hover alone would make it unreachable on a phone or by tab.
  document.querySelectorAll(".has-mega").forEach((item) => {
    const trigger = item.querySelector("a");
    trigger.addEventListener("click", (e) => {
      if (window.matchMedia("(hover: hover)").matches && !item.classList.contains("open")) return;
      if (!item.classList.contains("open")) {
        e.preventDefault();
        document.querySelectorAll(".has-mega.open").forEach((o) => o.classList.remove("open"));
        item.classList.add("open");
      }
    });
    item.addEventListener("focusin", () => item.classList.add("open"));
    item.addEventListener("focusout", (e) => {
      if (!item.contains(e.relatedTarget)) item.classList.remove("open");
    });
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") document.querySelectorAll(".has-mega.open").forEach((o) => o.classList.remove("open"));
  });

  const burger = document.querySelector(".burger");
  const menu = document.querySelector(".mobile-menu");
  if (burger && menu) {
    burger.addEventListener("click", () => {
      const open = burger.getAttribute("aria-expanded") === "true";
      burger.setAttribute("aria-expanded", String(!open));
      menu.classList.toggle("open", !open);
      document.body.style.overflow = !open ? "hidden" : "";
    });
  }
}

function closeMenu() {
  const burger = document.querySelector(".burger");
  const menu = document.querySelector(".mobile-menu");
  if (burger) burger.setAttribute("aria-expanded", "false");
  if (menu) menu.classList.remove("open");
  document.body.style.overflow = "";
}

/* One delegated listener on the document handles every internal link on
   every page, including links rendered after this runs. */
document.addEventListener("click", (e) => {
  const a = e.target.closest ? e.target.closest("a") : null;
  if (!a) return;

  if (a.dataset.lang) {
    e.preventDefault();
    navigate(`/${a.dataset.lang}/${STATE.route === "home" ? "" : STATE.route + (STATE.param ? "/" + STATE.param : "")}`);
    closeMenu();
    return;
  }

  const h = a.getAttribute("href") || "";
  if (!h.startsWith("#/")) return;
  e.preventDefault();
  closeMenu();
  document.querySelectorAll(".has-mega.open").forEach((o) => o.classList.remove("open"));
  navigate(h.slice(1));
});

addEventListener("hashchange", () => {
  const next = parsePath(location.hash);
  if (next.lang === STATE.lang && next.route === STATE.route && next.param === STATE.param) return;
  navigate(location.hash, { push: false });
});

let io = null;
function observeReveals() {
  if (io) io.disconnect();
  const items = document.querySelectorAll("[data-reveal]");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    items.forEach((el) => el.classList.add("in"));
    return;
  }
  io = new IntersectionObserver(
    (es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
    { rootMargin: "0px 0px -8% 0px", threshold: 0.04 }
  );
  items.forEach((el) => io.observe(el));
}

STATE = parsePath(location.hash || "/en/");
LANG = STATE.lang;
syncUrl();
render();
</script>
  </body>
</html>
