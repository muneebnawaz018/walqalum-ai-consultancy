:root {
  /* --- ground: warm graphite, never pure black --------------------------- */
  --ink: #14151a;
  --ink-2: #191a20;
  --surface: #1e1f26;
  --surface-2: #24252d;
  --edge: #2e2f38;
  --edge-2: #3c3d48;

  /* --- type: warm off-white, not blue-white ------------------------------ */
  --paper: #f2efe9;
  --paper-dim: #c8c3ba;
  --muted: #948e85;
  --muted-2: #6e6960;

  /* --- accent: one restrained champagne ---------------------------------- */
  --gold: #c9a96b;
  --gold-bright: #e3cb9b;
  --gold-deep: #9a7d45;
  --gold-wash: rgba(201, 169, 107, 0.1);

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-soft: cubic-bezier(0.22, 0.61, 0.36, 1);

  --shell: 80rem;
  --r: 10px;
  --r-sm: 6px;

  --f-display: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --f-sans: "Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --f-display-ar: "Naskh Arabic", "Plex Arabic", serif;
  --f-sans-ar: "Plex Arabic", "Plex Sans", ui-sans-serif, sans-serif;
  /* kept as a token so old markup still resolves — it is no longer monospace */
  --f-mono: var(--f-sans);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0 solid var(--edge);
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--f-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
}

/* --- Arabic ---------------------------------------------------------------
   Naskh carries the display voice; Plex Arabic the body. Arabic wants more
   leading and zero negative tracking. */
[dir="rtl"] body {
  font-family: var(--f-sans-ar);
}
[dir="rtl"] .display,
[dir="rtl"] h1,
[dir="rtl"] h2,
[dir="rtl"] h3,
[dir="rtl"] .h1,
[dir="rtl"] .h2,
[dir="rtl"] .h3 {
  font-family: var(--f-display-ar);
  letter-spacing: 0 !important;
  line-height: 1.42 !important;
}
[dir="rtl"] .display {
  line-height: 1.3 !important;
}
[dir="rtl"] .eyebrow,
[dir="rtl"] .mono {
  font-family: var(--f-sans-ar);
  letter-spacing: 0.06em;
}
[dir="rtl"] p,
[dir="rtl"] li {
  line-height: 1.9;
}

img,
svg {
  display: block;
  max-width: 100%;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  cursor: pointer;
}

::selection {
  background: rgba(201, 169, 107, 0.28);
  color: var(--paper);
}
:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
  border-radius: 3px;
}

::-webkit-scrollbar {
  width: 10px;
}
::-webkit-scrollbar-track {
  background: var(--ink);
}
::-webkit-scrollbar-thumb {
  background: var(--edge-2);
  border: 3px solid var(--ink);
  border-radius: 99px;
}

/* ---------- layout ------------------------------------------------------ */

.shell {
  width: 100%;
  max-width: var(--shell);
  margin-inline: auto;
  padding-inline: 1.5rem;
}
@media (min-width: 1024px) {
  .shell {
    padding-inline: 3rem;
  }
}

section {
  position: relative;
}
.section-pad {
  padding-block: clamp(3.5rem, 6vw, 6rem);
}
.rule {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--edge) 12%, var(--edge) 88%, transparent);
}

/* ---------- type -------------------------------------------------------- */

.display {
  font-family: var(--f-display);
  font-size: clamp(3.1rem, 7.4vw, 6.6rem);
  line-height: 1.0;
  letter-spacing: -0.021em;
  font-weight: 400;
}
h1,
.h1 {
  font-family: var(--f-display);
  font-size: clamp(2.35rem, 4.6vw, 3.9rem);
  line-height: 1.1;
  letter-spacing: -0.016em;
  font-weight: 400;
}
h2,
.h2 {
  font-family: var(--f-display);
  font-size: clamp(1.95rem, 3.3vw, 2.95rem);
  line-height: 1.16;
  letter-spacing: -0.013em;
  font-weight: 400;
}
h3,
.h3 {
  font-family: var(--f-display);
  font-size: clamp(1.2rem, 1.65vw, 1.45rem);
  line-height: 1.32;
  letter-spacing: -0.008em;
  font-weight: 500;
}

.lead {
  font-size: clamp(1.06rem, 1.35vw, 1.22rem);
  line-height: 1.68;
  color: var(--paper-dim);
  font-weight: 300;
}
.body {
  color: var(--paper-dim);
  line-height: 1.72;
}
.small {
  font-size: 0.875rem;
  line-height: 1.65;
  color: var(--muted);
}
.balance {
  text-wrap: balance;
}
.pretty {
  text-wrap: pretty;
}
.dim {
  color: var(--muted);
}

/* Labels are small-caps sans now, not monospace. This single change does
   more to remove the "robot" reading than any colour move. */
.eyebrow {
  font-family: var(--f-sans);
  font-size: 0.72rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
}
.eyebrow::before {
  content: "";
  width: 1.5rem;
  height: 1px;
  background: currentColor;
  opacity: 0.5;
}

.mono {
  font-family: var(--f-sans);
  font-variant-numeric: tabular-nums;
}

.grad {
  color: var(--gold-bright);
  font-style: italic;
}
[dir="rtl"] .grad {
  font-style: normal;
  color: var(--gold-bright);
}

/* ---------- surfaces ---------------------------------------------------- */

.facet {
  position: relative;
  background: linear-gradient(163deg, var(--surface) 0%, var(--ink-2) 100%);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  isolation: isolate;
  overflow: hidden;
}
.facet::before {
  content: "";
  position: absolute;
  inset-inline: 0;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201, 169, 107, 0.38), transparent);
  opacity: 0.7;
}
.facet-hover {
  transition:
    border-color 0.6s var(--ease),
    transform 0.6s var(--ease),
    box-shadow 0.6s var(--ease);
}
.facet-hover:hover {
  border-color: rgba(201, 169, 107, 0.34);
  transform: translateY(-4px);
  box-shadow: 0 22px 60px -34px rgba(0, 0, 0, 0.9);
}

/* The measurement grid is gone. What is left is a soft warm wash. */
.grid-veil {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201, 169, 107, 0.05), transparent 70%);
}

/* ---------- buttons ----------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.95rem 1.7rem;
  border-radius: var(--r-sm);
  font-size: 0.9375rem;
  font-weight: 500;
  letter-spacing: 0;
  transition:
    background 0.45s var(--ease),
    color 0.45s var(--ease),
    border-color 0.45s var(--ease),
    box-shadow 0.45s var(--ease),
    transform 0.45s var(--ease);
  white-space: nowrap;
}
.btn svg {
  width: 0.95rem;
  height: 0.95rem;
  transition: transform 0.45s var(--ease);
}
[dir="rtl"] .btn svg {
  transform: scaleX(-1);
}
.btn:hover svg {
  transform: translateX(3px);
}
[dir="rtl"] .btn:hover svg {
  transform: scaleX(-1) translateX(3px);
}

.btn-primary {
  background: var(--gold);
  color: #17140d;
  border: 1px solid var(--gold);
  font-weight: 600;
}
.btn-primary:hover {
  background: var(--gold-bright);
  border-color: var(--gold-bright);
  box-shadow: 0 14px 44px -18px rgba(201, 169, 107, 0.8);
  transform: translateY(-1px);
}

.btn-ghost {
  border: 1px solid var(--edge-2);
  color: var(--paper);
  background: rgba(30, 31, 38, 0.55);
  backdrop-filter: blur(10px);
}
.btn-ghost:hover {
  border-color: rgba(201, 169, 107, 0.45);
  color: var(--gold-bright);
  transform: translateY(-1px);
}
.btn-sm {
  padding: 0.62rem 1.15rem;
  font-size: 0.8125rem;
}

.link-arrow {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--gold);
  transition: gap 0.45s var(--ease), color 0.3s;
}
.link-arrow svg {
  width: 0.85rem;
  height: 0.85rem;
}
[dir="rtl"] .link-arrow svg {
  transform: scaleX(-1);
}
.link-arrow:hover {
  gap: 0.85rem;
  color: var(--gold-bright);
}

/* ---------- header ------------------------------------------------------ */

.skip {
  position: absolute;
  inset-inline-start: 1rem;
  top: -4rem;
  z-index: 200;
  background: var(--gold);
  color: #17140d;
  padding: 0.7rem 1.1rem;
  border-radius: var(--r-sm);
  font-size: 0.875rem;
  font-weight: 600;
  transition: top 0.25s var(--ease);
}
.skip:focus {
  top: 1rem;
}

.site-header {
  position: fixed;
  inset-inline: 0;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid transparent;
  transition: background 0.5s var(--ease), border-color 0.5s var(--ease);
}
.site-header.scrolled {
  background: rgba(20, 21, 26, 0.82);
  backdrop-filter: blur(18px) saturate(150%);
  border-bottom-color: var(--edge);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
  height: 5rem;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  flex-shrink: 0;
}
.logo-mark {
  width: 1.5rem;
  height: 1.5rem;
  flex-shrink: 0;
}
.logo-word {
  font-family: var(--f-display);
  font-size: 1.3rem;
  font-weight: 500;
  letter-spacing: -0.012em;
}
[dir="rtl"] .logo-word {
  font-family: var(--f-display);
}
.logo-desc {
  display: none;
  font-size: 0.66rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--muted-2);
  padding-inline-start: 0.85rem;
  border-inline-start: 1px solid var(--edge-2);
  max-width: 13rem;
  line-height: 1.45;
}
@media (min-width: 1280px) {
  .logo-desc {
    display: block;
  }
}

.nav {
  display: none;
  align-items: center;
  gap: 0.15rem;
}
@media (min-width: 1180px) {
  .nav {
    display: flex;
  }
}
.nav a {
  white-space: nowrap;
  padding: 0.5rem 0.7rem;
  font-size: 0.875rem;
  font-size: 0.9rem;
  color: var(--paper-dim);
  border-radius: var(--r-sm);
  transition: color 0.3s, background 0.3s;
}
.nav a:hover,
.nav a[aria-current="page"] {
  color: var(--paper);
  background: rgba(46, 47, 56, 0.6);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.lang-switch {
  display: flex;
  align-items: center;
  border: 1px solid var(--edge-2);
  border-radius: var(--r-sm);
  overflow: hidden;
  font-size: 0.75rem;
  letter-spacing: 0.04em;
}
.lang-switch a {
  padding: 0.45rem 0.65rem;
  color: var(--muted);
  transition: background 0.3s, color 0.3s;
}
.lang-switch a[aria-current="true"] {
  background: var(--edge);
  color: var(--paper);
}
.lang-switch a:hover {
  color: var(--gold);
}
.header-cta {
  display: none;
}
@media (min-width: 768px) {
  .header-cta {
    display: inline-flex;
  }
}

.burger {
  display: inline-flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 2.5rem;
  height: 2.5rem;
  border: 1px solid var(--edge-2);
  border-radius: var(--r-sm);
}
@media (min-width: 1180px) {
  .burger {
    display: none;
  }
}
.burger span {
  display: block;
  width: 1rem;
  height: 1px;
  background: var(--paper);
  transition: transform 0.35s var(--ease), opacity 0.2s;
}
.burger[aria-expanded="true"] span:nth-child(1) {
  transform: translateY(3px) rotate(45deg);
}
.burger[aria-expanded="true"] span:nth-child(2) {
  opacity: 0;
}
.burger[aria-expanded="true"] span:nth-child(3) {
  transform: translateY(-3px) rotate(-45deg);
}

.mobile-menu {
  position: fixed;
  inset: 0;
  z-index: 99;
  background: rgba(20, 21, 26, 0.98);
  backdrop-filter: blur(24px);
  padding: 6.5rem 1.5rem 2rem;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s var(--ease);
}
.mobile-menu.open {
  opacity: 1;
  pointer-events: auto;
}
.mobile-menu a {
  font-family: var(--f-display);
  font-size: 1.6rem;
  padding: 0.8rem 0;
  border-bottom: 1px solid var(--edge);
}

/* ---------- hero -------------------------------------------------------- */

.hero {
  position: relative;
  min-height: 100svh;
  display: flex;
  align-items: center;
  padding-block: 9rem 5rem;
  overflow: hidden;
}
#hero-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
.hero-fallback {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: none;
}
.hero-fallback.show {
  display: block;
}
.hero-vignette {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(to right, var(--ink) 0%, rgba(20, 21, 26, 0.9) 34%, rgba(20, 21, 26, 0.35) 55%, transparent 72%),
    linear-gradient(to bottom, rgba(20, 21, 26, 0.75) 0%, transparent 22%, transparent 66%, var(--ink) 100%);
}
[dir="rtl"] .hero-vignette {
  background:
    linear-gradient(to left, var(--ink) 0%, rgba(20, 21, 26, 0.9) 34%, rgba(20, 21, 26, 0.35) 55%, transparent 72%),
    linear-gradient(to bottom, rgba(20, 21, 26, 0.75) 0%, transparent 22%, transparent 66%, var(--ink) 100%);
}
@media (max-width: 859px) {
  .hero-vignette,
  [dir="rtl"] .hero-vignette {
    background:
      linear-gradient(to bottom, rgba(20, 21, 26, 0.82) 0%, rgba(20, 21, 26, 0.55) 30%, rgba(20, 21, 26, 0.88) 62%, var(--ink) 100%);
  }
  #hero-canvas {
    opacity: 0.8;
  }
}

.hero-inner {
  position: relative;
  z-index: 2;
  width: 100%;
}
.hero-copy {
  max-width: 40rem;
}
.hero .display {
  margin-block: 1.9rem 2.1rem;
}
.hero .display span {
  display: block;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.85rem;
  margin-top: 2.6rem;
}
.hero-meta {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.6rem 2rem;
  margin-top: 4rem;
  padding-top: 2rem;
  border-top: 1px solid var(--edge);
  max-width: 44rem;
}
@media (min-width: 700px) {
  .hero-meta {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
.hero-meta .k {
  font-family: var(--f-display);
  font-size: 1.75rem;
  color: var(--paper);
  letter-spacing: -0.015em;
  line-height: 1;
  unicode-bidi: isolate;
}
[dir="rtl"] .hero-meta .k {
  direction: ltr;
  text-align: right;
}
.hero-meta .v {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 0.45rem;
  line-height: 1.45;
}

.scroll-hint {
  position: absolute;
  inset-inline-start: 50%;
  bottom: 1.75rem;
  transform: translateX(-50%);
  display: none;
  z-index: 3;
  flex-direction: column;
  align-items: center;
  gap: 0.55rem;
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted-2);
}
@media (min-height: 880px) and (min-width: 900px) {
  .scroll-hint {
    display: flex;
  }
}
.scroll-hint i {
  display: block;
  width: 1px;
  height: 2.5rem;
  background: linear-gradient(to bottom, var(--gold), transparent);
  animation: drip 2.8s var(--ease-soft) infinite;
}
@keyframes drip {
  0% { transform: scaleY(0); transform-origin: top; }
  45% { transform: scaleY(1); transform-origin: top; }
  46% { transform: scaleY(1); transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; }
}

/* ---------- client strip ------------------------------------------------ */

.clients {
  padding-block: 2.75rem;
  border-block: 1px solid var(--edge);
  background: var(--ink-2);
}
.clients-inner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 1.25rem 3rem;
}
.clients-label {
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
  white-space: nowrap;
}
.clients ul {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2.75rem;
  list-style: none;
}
.clients li {
  font-family: var(--f-display);
  font-size: 1.2rem;
  color: var(--muted);
  transition: color 0.45s var(--ease);
}
.clients li:hover {
  color: var(--paper);
}

/* ---------- section heading -------------------------------------------- */

.sec-head {
  display: grid;
  gap: 2rem;
  margin-bottom: 4rem;
}
@media (min-width: 900px) {
  .sec-head {
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: 4rem;
    align-items: end;
  }
}
.sec-head h2 {
  margin-top: 1.3rem;
}
.sec-head .lead {
  max-width: 33rem;
}

/* ---------- grids ------------------------------------------------------- */

.grid-3 {
  display: grid;
  gap: 1px;
  background: var(--edge);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  overflow: hidden;
}
@media (min-width: 768px) {
  .grid-3 {
    grid-template-columns: repeat(3, 1fr);
  }
}
.grid-3 > * {
  background: var(--ink-2);
  padding: 2.5rem 2rem;
}

.cards {
  display: grid;
  gap: 1.25rem;
}
@media (min-width: 768px) {
  .cards-2 { grid-template-columns: repeat(2, 1fr); }
  .cards-3 { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 1100px) {
  .cards-4 { grid-template-columns: repeat(4, 1fr); }
}

/* ---------- practices --------------------------------------------------- */

.practice {
  display: grid;
  gap: 1.5rem;
  padding-block: 3rem;
  border-top: 1px solid var(--edge);
  position: relative;
}
.practice:last-child {
  border-bottom: 1px solid var(--edge);
}
@media (min-width: 900px) {
  .practice {
    grid-template-columns: 3.5rem minmax(0, 1fr) minmax(0, 1.2fr);
    gap: 2.75rem;
    align-items: start;
    padding-block: 3.5rem;
  }
}
.practice::after {
  content: "";
  position: absolute;
  inset-inline: 0;
  top: -1px;
  height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent 55%);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.8s var(--ease);
}
[dir="rtl"] .practice::after {
  transform-origin: right;
  background: linear-gradient(-90deg, var(--gold), transparent 55%);
}
.practice:hover::after {
  transform: scaleX(1);
}
.practice-idx {
  font-family: var(--f-display);
  font-size: 1rem;
  color: var(--gold-deep);
  padding-top: 0.4rem;
  unicode-bidi: isolate;
}
.practice-promise {
  font-family: var(--f-display);
  font-style: italic;
  color: var(--gold);
  font-size: 1.05rem;
  margin-top: 0.7rem;
  line-height: 1.5;
}
[dir="rtl"] .practice-promise {
  font-style: normal;
}
.practice-buyer {
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-top: 1.2rem;
}
.caps {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-top: 1.6rem;
  list-style: none;
}
.caps li {
  font-size: 0.79rem;
  color: var(--paper-dim);
  padding: 0.38rem 0.8rem;
  border: 1px solid var(--edge-2);
  border-radius: 99px;
  background: rgba(30, 31, 38, 0.6);
}
.stack-line {
  font-size: 0.72rem;
  color: var(--muted-2);
  margin-top: 1.6rem;
  letter-spacing: 0.03em;
  line-height: 1.8;
}

/* ---------- engagement cards ------------------------------------------- */

.eng {
  display: flex;
  flex-direction: column;
  padding: 2.2rem 1.9rem 1.9rem;
}
.eng-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.15rem;
}
.eng-dur {
  font-size: 0.7rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--gold);
  padding: 0.3rem 0.7rem;
  border: 1px solid rgba(201, 169, 107, 0.3);
  border-radius: 99px;
  white-space: nowrap;
  unicode-bidi: isolate;
}
.eng-tag {
  font-family: var(--f-display);
  font-style: italic;
  color: var(--paper);
  font-size: 1.1rem;
  line-height: 1.45;
  margin-bottom: 1rem;
}
[dir="rtl"] .eng-tag {
  font-style: normal;
}
.eng ul {
  list-style: none;
  margin-top: 1.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--edge);
  display: grid;
  gap: 0.7rem;
  flex: 1;
}
.eng li {
  position: relative;
  padding-inline-start: 1.15rem;
  font-size: 0.85rem;
  color: var(--paper-dim);
  line-height: 1.6;
}
.eng li::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 0.6em;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold-deep);
}

/* ---------- method ------------------------------------------------------ */

.method {
  display: grid;
  gap: 1px;
  background: var(--edge);
  border-block: 1px solid var(--edge);
}
@media (min-width: 900px) {
  .method {
    grid-template-columns: repeat(4, 1fr);
  }
}
.method-step {
  background: var(--ink);
  padding: 2.75rem 1.9rem 3rem;
  position: relative;
  transition: background 0.6s var(--ease);
}
.method-step:hover {
  background: var(--ink-2);
}
.method-step .n {
  font-family: var(--f-display);
  font-size: 0.95rem;
  color: var(--gold-deep);
  unicode-bidi: isolate;
}
.method-step h3 {
  margin-block: 1.15rem 0.8rem;
}
.method-step p {
  font-size: 0.88rem;
  color: var(--muted);
  line-height: 1.7;
}
.method-step::before {
  content: "";
  position: absolute;
  top: 0;
  inset-inline-start: 0;
  width: 100%;
  height: 2px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: inline-start;
  transition: transform 0.8s var(--ease);
}
.method-step:hover::before {
  transform: scaleX(1);
}

/* ---------- work cards -------------------------------------------------- */

.case {
  display: flex;
  flex-direction: column;
  padding: 0;
  min-height: 22rem;
}
.case-visual {
  position: relative;
  height: 10rem;
  overflow: hidden;
  border-bottom: 1px solid var(--edge);
  background:
    radial-gradient(ellipse at 28% 18%, rgba(201, 169, 107, 0.16), transparent 62%),
    radial-gradient(ellipse at 80% 82%, rgba(154, 125, 69, 0.12), transparent 60%),
    var(--ink-2);
}
.case-visual svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.6;
  transition: transform 1.2s var(--ease), opacity 0.6s;
}
.case:hover .case-visual svg {
  transform: scale(1.05);
  opacity: 0.9;
}
.case-body {
  padding: 1.7rem 1.7rem 1.85rem;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.case-meta {
  display: flex;
  gap: 0.55rem;
  align-items: center;
  font-size: 0.68rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.case-client {
  color: var(--gold);
}
.case h3 {
  font-size: 1.2rem;
  line-height: 1.38;
  font-weight: 400;
  margin-bottom: 1rem;
}
.case-foot {
  margin-top: auto;
  padding-top: 1.25rem;
}

/* ---------- industries -------------------------------------------------- */

.ind {
  padding: 2.2rem 1.9rem;
  display: flex;
  flex-direction: column;
}
.ind h3 {
  margin-bottom: 1rem;
}
.ind .thesis {
  font-size: 0.94rem;
  line-height: 1.68;
  color: var(--paper-dim);
  flex: 1;
}
.ind .where {
  margin-top: 1.6rem;
  padding-top: 1.35rem;
  border-top: 1px solid var(--edge);
  list-style: none;
  display: grid;
  gap: 0.55rem;
}
.ind .where li {
  font-size: 0.81rem;
  color: var(--muted);
  padding-inline-start: 0.95rem;
  position: relative;
  line-height: 1.55;
}
.ind .where li::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 0.62em;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold-deep);
}

/* ---------- offices ----------------------------------------------------- */

.office {
  padding: 2rem 1.75rem;
}
.office .city {
  font-family: var(--f-display);
  font-size: 1.5rem;
  letter-spacing: -0.01em;
  margin-bottom: 0.35rem;
}
.office .country {
  font-size: 0.72rem;
  color: var(--muted-2);
  letter-spacing: 0.11em;
  text-transform: uppercase;
}
.office .role {
  margin-top: 1.25rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--edge);
  font-size: 0.92rem;
  color: var(--gold);
  line-height: 1.55;
}
.office .tz {
  margin-top: 0.8rem;
  font-size: 0.74rem;
  color: var(--muted-2);
  letter-spacing: 0.05em;
  unicode-bidi: isolate;
}

/* ---------- CTA band ---------------------------------------------------- */

.cta-band {
  position: relative;
  overflow: hidden;
  border-top: 1px solid var(--edge);
  background:
    radial-gradient(ellipse 60% 110% at 50% 100%, rgba(201, 169, 107, 0.1), transparent 68%),
    var(--ink-2);
}
.cta-inner {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 42rem;
  margin-inline: auto;
}
.cta-inner .btn-row {
  display: flex;
  gap: 0.85rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 2.4rem;
}

/* ---------- footer ------------------------------------------------------ */

.site-footer {
  border-top: 1px solid var(--edge);
  background: var(--ink);
  padding-block: 4.5rem 2rem;
}
.footer-grid {
  display: grid;
  gap: 2.75rem;
  margin-bottom: 3.5rem;
}
@media (min-width: 768px) {
  .footer-grid {
    grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr));
    gap: 2rem;
  }
}
.footer-grid h4 {
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
  font-weight: 500;
  margin-bottom: 1.2rem;
}
.footer-grid ul {
  list-style: none;
  display: grid;
  gap: 0.65rem;
}
.footer-grid ul a,
.footer-grid ul li {
  font-size: 0.875rem;
  color: var(--paper-dim);
  transition: color 0.3s;
}
.footer-grid ul a:hover {
  color: var(--gold);
}
.footer-brand p {
  font-size: 0.875rem;
  color: var(--muted);
  line-height: 1.7;
  max-width: 24rem;
  margin-top: 1.2rem;
}
.footer-bottom {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  justify-content: space-between;
  align-items: center;
  padding-top: 1.85rem;
  border-top: 1px solid var(--edge);
  font-size: 0.79rem;
  color: var(--muted-2);
}
.footer-bottom nav {
  display: flex;
  gap: 1.5rem;
}
.footer-bottom a:hover {
  color: var(--gold);
}

/* ---------- prose (case study / insights) ------------------------------- */

.doc {
  max-width: 68ch;
}
.narr-label,
.eng-label {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1.1rem;
}

/* ---------- reveal ------------------------------------------------------ */

[data-reveal] {
  opacity: 0;
  transform: translateY(16px);
  transition:
    opacity 1s var(--ease),
    transform 1s var(--ease);
  transition-delay: var(--d, 0ms);
}
[data-reveal].in {
  opacity: 1;
  transform: none;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  [data-reveal] { opacity: 1; transform: none; }
}

/* ---------- animated fallback ------------------------------------------
   If WebGL is unavailable this still has warmth and motion — it is not a
   dead grid. */
.hero-fallback .fb-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 46% 52% at 72% 46%, rgba(201, 169, 107, 0.3), transparent 62%),
    radial-gradient(ellipse 30% 36% at 62% 62%, rgba(154, 125, 69, 0.22), transparent 66%);
  animation: breathe 11s ease-in-out infinite;
}
[dir="rtl"] .hero-fallback .fb-glow {
  transform: scaleX(-1);
}
.hero-fallback .fb-shard {
  position: absolute;
  inset-inline-start: 72%;
  top: 50%;
  height: 30rem;
  width: auto;
  transform: translate(-50%, -50%);
  animation: sway 18s ease-in-out infinite;
}
[dir="rtl"] .hero-fallback .fb-shard {
  inset-inline-start: auto;
  inset-inline-end: 72%;
  transform: translate(50%, -50%);
}
@keyframes breathe {
  0%, 100% { opacity: 0.75; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}
@keyframes sway {
  0%, 100% { transform: translate(-50%, -50%) rotate(-3deg); }
  50% { transform: translate(-50%, -52%) rotate(3deg); }
}

/* ---------- mockup badge ------------------------------------------------ */

.mock-note {
  position: fixed;
  inset-inline-end: 1rem;
  bottom: 1rem;
  z-index: 150;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted-2);
  background: rgba(20, 21, 26, 0.92);
  border: 1px solid var(--edge-2);
  border-radius: 99px;
  padding: 0.45rem 0.9rem;
  backdrop-filter: blur(10px);
}

/* ==========================================================================
   v2.1 — removing the machine-made tells

   What made round 2 read as AI-generated was not the colours. It was the
   uniformity: every section built to the identical rhythm (eyebrow, heading,
   lead, row of three equal cards), every card the same height, nothing ever
   off the grid, no people, no texture, no hand anywhere on the page.

   The fixes below are all structural: break the grid, vary the rhythm,
   introduce editorial furniture, and put a human voice on the page.
   ========================================================================== */

/* Paper grain. A flat gradient is a screen; a page has tooth. */
.grain {
  position: fixed;
  inset: 0;
  z-index: 300;
  pointer-events: none;
  opacity: 0.35;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.55'/></svg>");
}

/* Drop cap — an editorial signal no template generator reaches for. */
.dropcap::first-letter {
  float: left;
  font-family: var(--f-display);
  font-size: 4.1em;
  line-height: 0.78;
  padding-inline-end: 0.08em;
  padding-top: 0.07em;
  color: var(--gold);
  font-weight: 400;
}
/* Arabic does not take drop caps. */
[dir="rtl"] .dropcap::first-letter {
  float: none;
  font-size: 1em;
  color: inherit;
  padding: 0;
  line-height: inherit;
}

/* A note in the founder's voice, signed. */
.note {
  display: grid;
  gap: 2.5rem;
}
@media (min-width: 940px) {
  .note {
    grid-template-columns: minmax(0, 1fr) 19rem;
    gap: 4.5rem;
    align-items: start;
  }
}
.note-body {
  font-family: var(--f-display);
  font-size: clamp(1.22rem, 1.85vw, 1.6rem);
  line-height: 1.62;
  color: var(--paper);
  max-width: 40ch;
}
[dir="rtl"] .note-body {
  line-height: 1.9;
}
.note-body p + p {
  margin-top: 1.15rem;
}
.sig {
  margin-top: 2.25rem;
}
.sig svg {
  width: 10.5rem;
  height: auto;
  color: var(--gold);
}
.sig .who {
  margin-top: 1rem;
  font-size: 0.8rem;
  color: var(--muted);
  line-height: 1.6;
}

/* Photography slots. Marked, not faked. */
.photo {
  position: relative;
  border: 1px solid var(--edge);
  border-radius: var(--r);
  overflow: hidden;
  background:
    repeating-linear-gradient(135deg, rgba(201,169,107,0.028) 0 12px, transparent 12px 24px),
    linear-gradient(152deg, var(--surface), var(--ink-2));
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 17rem;
}
.photo span {
  font-size: 0.7rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--muted-2);
  text-align: center;
  padding: 1.5rem;
  line-height: 1.9;
}
/* A degree of rotation is the cheapest possible signal that a hand was here. */
.tilt-a { transform: rotate(-0.65deg); }
.tilt-b { transform: rotate(0.5deg); }
.photo-cap {
  margin-top: 1rem;
  font-size: 0.79rem;
  color: var(--muted);
  line-height: 1.65;
  max-width: 27rem;
}
.photo-cap b {
  color: var(--paper-dim);
  font-weight: 500;
}

/* Industries as an editorial list rather than four identical tiles. */
.ind-row {
  display: grid;
  gap: 1rem;
  padding-block: 2.6rem;
  border-top: 1px solid var(--edge);
}
.ind-row:last-child {
  border-bottom: 1px solid var(--edge);
}
@media (min-width: 900px) {
  .ind-row {
    grid-template-columns: 2.5rem minmax(0, 0.85fr) minmax(0, 1.15fr);
    gap: 2.75rem;
    align-items: baseline;
  }
}
.ind-row .num {
  font-family: var(--f-display);
  font-size: 1rem;
  color: var(--gold-deep);
  unicode-bidi: isolate;
}
.ind-row h3 {
  font-size: clamp(1.35rem, 1.9vw, 1.7rem);
}
.ind-row .thesis {
  font-family: var(--f-display);
  font-style: italic;
  font-size: 1.12rem;
  line-height: 1.6;
  color: var(--paper-dim);
}
[dir="rtl"] .ind-row .thesis {
  font-style: normal;
}
.ind-row .where {
  margin-top: 1.15rem;
  list-style: none;
  display: grid;
  gap: 0.5rem;
}
.ind-row .where li {
  font-size: 0.85rem;
  color: var(--muted);
  padding-inline-start: 0.95rem;
  position: relative;
  line-height: 1.6;
}
.ind-row .where li::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 0.65em;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold-deep);
}

/* Selected work: one lead story, two below it. Not three of a kind. */
.work-grid {
  display: grid;
  gap: 1.25rem;
}
@media (min-width: 940px) {
  .work-grid {
    grid-template-columns: 1.32fr 1fr;
    align-items: start;
  }
}
.work-side {
  display: grid;
  gap: 1.25rem;
}
.case-lg .case-visual {
  height: 17rem;
}
.case-lg h3 {
  font-size: clamp(1.4rem, 2.1vw, 1.85rem);
  line-height: 1.3;
}
.case-lg .case-body {
  padding: 2rem 2rem 2.2rem;
}
.case-sm {
  min-height: 0;
}
.case-sm .case-visual {
  height: 6.5rem;
}
.case-sm h3 {
  font-size: 1.05rem;
}

/* Marginalia — an aside, in a voice, off the main measure. */
.margin-note {
  font-family: var(--f-display);
  font-style: italic;
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--muted);
  border-inline-start: 2px solid var(--gold-deep);
  padding-inline-start: 1.1rem;
}
[dir="rtl"] .margin-note {
  font-style: normal;
}

/* A statement that interrupts the page instead of sitting in a card. */
.pull {
  font-family: var(--f-display);
  font-size: clamp(1.6rem, 3.1vw, 2.6rem);
  line-height: 1.32;
  letter-spacing: -0.012em;
  color: var(--paper);
  max-width: 30ch;
}
.pull-attrib {
  margin-top: 1.5rem;
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.6;
}

/* Offsets that stop every section starting on the same vertical line. */
@media (min-width: 1100px) {
  .offset-r { margin-inline-start: 12%; }
  .offset-l { margin-inline-end: 14%; }
}

/* ==========================================================================
   v3 — components for the full navigable site
   ========================================================================== */

.page-head {
  position: relative;
  overflow: hidden;
  padding-block: clamp(8rem, 13vw, 11rem) clamp(2.5rem, 5vw, 4rem);
}
.page-head h1 { max-width: 20ch; margin-top: 1.4rem; }

.crumb {
  font-size: 0.78rem;
  letter-spacing: 0.05em;
  color: var(--muted-2);
}
.crumb a { color: var(--muted); }
.crumb a:hover { color: var(--gold); }

a.plain { color: inherit; }
a.plain:hover { color: var(--gold-bright); }
a.plain-link { color: var(--gold); }
a.plain-link:hover { color: var(--gold-bright); }

.split { display: grid; gap: 2.5rem; }
@media (min-width: 940px) {
  .split { grid-template-columns: minmax(0, 1fr) 19rem; gap: 4rem; align-items: start; }
}

.fact {
  padding-block: 1.1rem;
  border-top: 1px solid var(--edge);
}
.fact:first-child { border-top: 0; padding-top: 0; }
.fact > span {
  display: block;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-bottom: 0.5rem;
}
.fact p { font-size: 0.9rem; color: var(--paper-dim); line-height: 1.6; }

.cap-card { padding: 1.8rem 1.6rem; }
.cap-card h3 { font-size: 1.15rem; }

/* engagements as rows, not another card grid */
.eng-row {
  display: grid;
  gap: 1.5rem;
  padding-block: 2.8rem;
  border-top: 1px solid var(--edge);
}
.eng-row:last-of-type { border-bottom: 1px solid var(--edge); }
@media (min-width: 940px) {
  .eng-row { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); gap: 3.5rem; align-items: start; }
}
.eng-row h3 { font-size: clamp(1.35rem, 2vw, 1.75rem); }
.eng-list { list-style: none; display: grid; gap: 0.65rem; margin-top: 0.9rem; }
.eng-list li {
  position: relative;
  padding-inline-start: 1.15rem;
  font-size: 0.87rem;
  color: var(--paper-dim);
  line-height: 1.6;
}
.eng-list li::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 0.6em;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--gold-deep);
}

/* case study */
.case-facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.5rem 2rem;
  margin-top: 2.5rem;
  padding-top: 1.75rem;
  border-top: 1px solid var(--edge);
}
@media (min-width: 800px) { .case-facts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.case-facts span {
  display: block;
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-bottom: 0.5rem;
}
.case-facts p { font-size: 0.92rem; color: var(--paper); line-height: 1.6; }

.case-hero {
  height: clamp(12rem, 26vw, 19rem);
  background:
    radial-gradient(ellipse at 26% 18%, rgba(201,169,107,0.16), transparent 62%),
    radial-gradient(ellipse at 80% 84%, rgba(154,125,69,0.12), transparent 60%),
    var(--ink-2);
}
.case-hero svg { width: 100%; height: 100%; opacity: 0.6; }

.approach { margin-top: 1rem; }
.approach-row {
  display: grid;
  gap: 0.75rem;
  padding-block: 1.5rem;
  border-top: 1px solid var(--edge);
}
@media (min-width: 900px) {
  .approach-row { grid-template-columns: 3.5rem minmax(0, 1fr); gap: 2rem; align-items: baseline; }
}
.approach-row .n { font-family: var(--f-display); color: var(--gold-deep); font-size: 0.95rem; }
.approach-row p { color: var(--paper-dim); line-height: 1.7; max-width: 62ch; }

.metrics { margin-top: 3.5rem; padding: 2rem; border: 1px dashed var(--edge-2); border-radius: var(--r); }
.metric { padding: 1.6rem; text-align: center; }
.metric .dash {
  font-family: var(--f-display);
  font-size: 2.6rem;
  color: var(--muted-2);
  line-height: 1;
  margin-bottom: 0.6rem;
}

/* insights */
.post { padding: 1.8rem 1.7rem; display: flex; flex-direction: column; }
.post h3 { font-size: 1.1rem; line-height: 1.4; font-weight: 400; }
.post-lg { padding: 2.4rem 2.2rem; }
.post-lg h3 { font-size: clamp(1.35rem, 2vw, 1.75rem); line-height: 1.32; }
.tag-proposed {
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid rgba(201,169,107,0.35);
  border-radius: 99px;
  padding: 0.15rem 0.5rem;
}
.newsroom {
  margin-top: 3rem;
  padding: 2rem;
  border: 1px dashed var(--edge-2);
  border-radius: var(--r);
  max-width: 42rem;
}

/* leadership */
.leader { padding: 1.9rem 1.7rem; }
.leader .avatar {
  width: 3rem; height: 3rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(150deg, rgba(201,169,107,0.22), rgba(154,125,69,0.08));
  border: 1px solid var(--edge-2);
  font-family: var(--f-display);
  font-size: 0.95rem;
  color: var(--gold-bright);
  margin-bottom: 1.1rem;
  unicode-bidi: isolate;
}
.leader h3 { font-size: 1.1rem; }
.leader .role { font-size: 0.78rem; color: var(--gold); margin-top: 0.35rem; }

/* contact form */
.form { padding: 2.2rem; display: grid; gap: 1.75rem; }
.form fieldset { border: 0; }
.form legend {
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-bottom: 0.9rem;
}
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip { cursor: pointer; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span {
  display: inline-block;
  font-size: 0.83rem;
  padding: 0.45rem 0.9rem;
  border: 1px solid var(--edge-2);
  border-radius: 99px;
  color: var(--paper-dim);
  transition: all 0.3s var(--ease);
}
.chip input:checked + span {
  border-color: var(--gold);
  background: var(--gold-wash);
  color: var(--gold-bright);
}
.chip input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
.field { display: block; }
.field > span {
  display: block;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-bottom: 0.55rem;
}
.field input, .field textarea {
  width: 100%;
  background: var(--ink);
  border: 1px solid var(--edge-2);
  border-radius: var(--r-sm);
  padding: 0.8rem 0.95rem;
  color: var(--paper);
  font: inherit;
  font-size: 0.92rem;
  transition: border-color 0.3s;
}
.field textarea { resize: vertical; line-height: 1.6; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
.field input::placeholder, .field textarea::placeholder { color: var(--muted-2); }
.field-row { display: grid; gap: 1.25rem; }
@media (min-width: 620px) { .field-row { grid-template-columns: 1fr 1fr; } }
.form button { justify-self: start; }
.form-msg {
  font-size: 0.9rem;
  color: var(--gold-bright);
  border-inline-start: 2px solid var(--gold);
  padding-inline-start: 0.9rem;
}

/* hero fallback in v3 is pure light, no shard */
.hero-fallback .fb-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 48% 55% at 70% 48%, rgba(201,169,107,0.26), transparent 64%),
    radial-gradient(ellipse 34% 40% at 60% 64%, rgba(154,125,69,0.2), transparent 66%);
  animation: breathe 13s ease-in-out infinite;
}

/* ==========================================================================
   v3.1 — scrolling client strip, and imagery to break up the text
   ========================================================================== */

/* --- client marquee ------------------------------------------------------ */
.clients-inner { flex-wrap: nowrap; }
.clients-viewport {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
}
.clients-track {
  display: flex;
  width: max-content;
  animation: marquee 42s linear infinite;
}
[dir="rtl"] .clients-track { animation-name: marquee-rtl; }
.clients-track ul {
  display: flex;
  gap: 3.25rem;
  padding-inline-end: 3.25rem;
  list-style: none;
  flex: none;
}
.clients-viewport:hover .clients-track,
.clients-viewport:focus-within .clients-track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes marquee-rtl { to { transform: translateX(50%); } }
@media (prefers-reduced-motion: reduce) {
  .clients-track { animation: none; }
  .clients-viewport { overflow-x: auto; }
}

/* --- imagery ------------------------------------------------------------- */
.case-visual img,
.case-hero img,
.post-visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 1.4s var(--ease), opacity 0.6s;
  opacity: 1;
}
.case:hover .case-visual img { transform: scale(1.045); opacity: 1; }
.case-hero { padding: 0; overflow: hidden; }
.case-hero img { height: 100%; }

.post { padding: 0; overflow: hidden; }
.post-visual { height: 8rem; overflow: hidden; border-bottom: 1px solid var(--edge); }
.post-lg .post-visual { height: 13rem; }
.post-body { padding: 1.7rem 1.7rem 1.85rem; display: flex; flex-direction: column; flex: 1; }
.post-lg .post-body { padding: 2.2rem 2.2rem 2.4rem; }
.post:hover .post-visual img { transform: scale(1.04); opacity: 1; }

/* photo slots now carry a plate behind the label, so the page has weight
   where the real photograph will go */
.photo { position: relative; }
.photo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.7;
}
.photo span {
  position: relative;
  z-index: 1;
  background: rgba(20, 21, 26, 0.62);
  backdrop-filter: blur(3px);
  border-radius: var(--r-sm);
}

.leader .avatar { position: relative; overflow: hidden; }
.leader .avatar img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.55;
}
.leader .avatar span { position: relative; z-index: 1; }

/* full-width editorial band */
.band {
  position: relative;
  height: clamp(13rem, 26vw, 22rem);
  overflow: hidden;
  border-block: 1px solid var(--edge);
}
.band img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
.band::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(20,21,26,0.55), rgba(20,21,26,0.2) 45%, rgba(20,21,26,0.85));
}
.band-cap {
  position: absolute;
  inset-inline: 0;
  bottom: 1.25rem;
  z-index: 2;
}
.band-cap span {
  font-size: 0.68rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ==========================================================================
   v3.2 — alignment pass

   A layout audit across every route at 1440 / 1024 / 768 surfaced three
   recurring faults:
     1. card grids were not stretching, so columns ended at different heights
        and left dead space under the shorter one;
     2. asymmetric grids sized their text column at 1fr while the prose
        inside was capped at a reading measure, opening a gap between the
        two;
     3. long-form pages left the whole outer column empty beside the text.
   ========================================================================== */

/* --- 1. every card fills its cell ---------------------------------------- */
.cards { align-items: stretch; }
.cards > *,
.grid-3 > * { height: 100%; }
.facet.eng,
.facet.ind,
.facet.office,
.facet.leader,
.cap-card,
.metric { height: 100%; }

.office,
.leader,
.cap-card {
  display: flex;
  flex-direction: column;
}

/* --- 2. the asymmetric work / insights grid ------------------------------ */
.work-grid { align-items: stretch; }
.work-grid > * { height: 100%; }
.work-side {
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 1.25rem;
  align-content: stretch;
}
.work-side > * { height: 100%; }

/* The image absorbs the leftover height, so the lead card's base lines up
   with the two stacked cards beside it instead of floating short. */
.case,
.post {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.case-visual,
.post-visual {
  flex: 1 1 auto;
  min-height: 7rem;
  height: auto;
}
.case-lg .case-visual { min-height: 14rem; }
.post-lg .post-visual { min-height: 12rem; }
.case-body,
.post-body {
  flex: 0 0 auto;
  display: block;
}
.case-foot { margin-top: 1.25rem; }

/* --- 3. prose columns sized to their own measure ------------------------- */
.note-body { max-width: none; }

@media (min-width: 940px) {
  .note {
    grid-template-columns: minmax(0, 48ch) minmax(0, 20rem);
    justify-content: space-between;
    gap: 3.5rem;
  }
  .split {
    grid-template-columns: minmax(0, 66ch) minmax(0, 20rem);
    justify-content: space-between;
    gap: 3.5rem;
  }
  .sec-head {
    grid-template-columns: minmax(0, 1fr) minmax(0, 30rem);
    justify-content: space-between;
  }
  .sec-head .lead { max-width: none; }
}

/* a rail that stays with you down a long page */
.rail {
  position: sticky;
  top: 6.5rem;
  align-self: start;
}
.rail .fact:first-child { border-top: 0; padding-top: 0; }
.rail .caps { margin-top: 0.6rem; }
.rail .caps li { font-size: 0.74rem; padding: 0.28rem 0.62rem; }

/* long-form body no longer needs its own cap — the column provides it */
.split .doc { max-width: none; }

/* --- 4. engagement rows: narrower label column, less trapped space ------- */
@media (min-width: 940px) {
  .eng-row { grid-template-columns: minmax(0, 21rem) minmax(0, 1fr); gap: 3.5rem; }
  .practice { grid-template-columns: 3rem minmax(0, 17rem) minmax(0, 1fr); gap: 2.5rem; }
  .ind-row { grid-template-columns: 2.5rem minmax(0, 21rem) minmax(0, 1fr); gap: 2.5rem; }
}

/* --- 5. tablet: stop three-column editorial rows from cramping ----------- */
@media (min-width: 900px) and (max-width: 1100px) {
  .ind-row,
  .practice { grid-template-columns: 2.5rem minmax(0, 1fr); }
  .ind-row > :last-child,
  .practice > :last-child { grid-column: 2; }
}

/* --- 6. odds and ends ---------------------------------------------------- */
.newsroom { max-width: none; }
.metrics { margin-inline: 0; }
.approach-row p { max-width: none; }

/* outcomes read better as a short list than as three equal cards */
.outcome-list { list-style: none; display: grid; gap: 0.9rem; margin-top: 1rem; }
.outcome-list li {
  position: relative;
  padding-inline-start: 1.4rem;
  color: var(--paper-dim);
  line-height: 1.7;
}
.outcome-list li::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 0.72em;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
}

/* section labels inside long-form copy need a rule and real air, or the
   narrative runs together as one grey block */
.narr-label.sep {
  border-top: 1px solid var(--edge);
  padding-top: 1.75rem;
  margin-top: 3.5rem;
}
.metrics { max-width: none; }

/* ==========================================================================
   v3.3 — vertical rhythm

   Section padding was clamp(5.5rem, 12vw, 11rem) on BOTH sides, so two
   consecutive sections put ~350px of nothing between them at desktop. That
   is what read as "so many empty gaps". Halved above; the blocks below no
   longer add their own on top of it.
   ========================================================================== */

.method-block > .shell { padding-block: 0 2.5rem; }
.page-head { padding-block: clamp(7rem, 10vw, 9rem) clamp(2rem, 4vw, 3.25rem); }
.cta-band.section-pad { padding-block: clamp(4rem, 7vw, 6.5rem); }
.sec-head { margin-bottom: 3rem; }

/* leadership / offices sit closer to their headings */
.section-pad > .shell > h2 { margin-top: 0; }

/* Cap how far a card image may grow. Letting it flex without a ceiling made
   the lead card in an asymmetric grid render as a giant photo with a caption
   stuck to the bottom. Now the image grows a little, then the body takes the
   remaining height and pins its link to the base. */
.case-visual,
.post-visual {
  flex: 1 1 auto;
  min-height: 7rem;
  max-height: 11rem;
}
.case-lg .case-visual { min-height: 12rem; max-height: 17rem; }
.post-lg .post-visual { min-height: 11rem; max-height: 15rem; }

.case-body,
.post-body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
}
.case-foot { margin-top: auto; padding-top: 1.4rem; }
.post-body > *:last-child { margin-top: auto; padding-top: 1.4rem; }

/* ==========================================================================
   v4 — four blocks rebuilt

   These were not alignment faults, so nudging them was never going to work:
     · the industries row put three short bullets in a 1fr column, so the
       column was always wider than its content;
     · the delivery-model band paired a narrow paragraph with a small image
       and left the middle empty;
     · the asymmetric lead card is structurally taller than its content
       whenever the column beside it holds two cards;
     · the founder's note ran a narrow measure down a 1280px page.
   Each is rebuilt below rather than adjusted.
   ========================================================================== */

/* --- feature band: copy beside a tall plate that fills its column --------- */
.feature {
  display: grid;
  gap: 2.25rem;
  align-items: center;
}
@media (min-width: 940px) {
  .feature {
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.92fr);
    gap: 4.5rem;
  }
  .feature.reverse > :first-child { order: 2; }
}
.feature-copy > * + * { margin-top: 1.35rem; }
.feature-media {
  position: relative;
  border: 1px solid var(--edge);
  border-radius: var(--r);
  overflow: hidden;
  width: 100%;
  aspect-ratio: 4 / 5;
}
@media (min-width: 940px) {
  .feature-media { aspect-ratio: 5 / 6; }
}
.feature-media img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.62;
}
.feature-media::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(20, 21, 26, 0.9), rgba(20, 21, 26, 0.1) 55%);
}
.feature-media .plate-label {
  position: absolute;
  inset-inline: 1.5rem;
  bottom: 1.5rem;
  z-index: 2;
}
.feature-media .plate-label b {
  display: block;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 0.5rem;
}
.feature-media .plate-label span {
  font-size: 0.8rem;
  color: var(--paper-dim);
  line-height: 1.6;
  display: block;
}

/* --- wide card: image on one half, copy on the other --------------------- */
.wide-card {
  display: grid;
  grid-template-columns: 1fr;
  overflow: hidden;
  padding: 0;
}
@media (min-width: 900px) {
  .wide-card { grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); }
}
.wide-media {
  position: relative;
  min-height: 15rem;
  border-bottom: 1px solid var(--edge);
}
@media (min-width: 900px) {
  .wide-media { border-bottom: 0; border-inline-end: 1px solid var(--edge); min-height: 21rem; }
}
.wide-media img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 1.4s var(--ease);
}
.wide-card:hover .wide-media img { transform: scale(1.04); }
.wide-body {
  padding: 2.4rem 2.4rem 2.6rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.wide-body h3 {
  font-size: clamp(1.4rem, 2.1vw, 1.9rem);
  line-height: 1.3;
  font-weight: 400;
  margin-block: 0.9rem 1rem;
}
.wide-body .link-arrow { margin-top: 1.5rem; align-self: start; }

/* --- industries: bullets spread across the remaining width --------------- */
@media (min-width: 1100px) {
  .ind-row { grid-template-columns: 2.5rem minmax(0, 25rem) minmax(0, 1fr); }
  .ind-row .where {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.75rem;
    align-items: start;
  }
  .ind-row .where li { padding-inline-start: 0; padding-top: 1rem; border-top: 1px solid var(--edge); }
  .ind-row .where li::before {
    top: 0;
    inset-inline-start: 0;
    width: 2rem;
    height: 1px;
    border-radius: 0;
    background: var(--gold);
  }
}

/* --- equal three-up card row (replaces the tall lead card) --------------- */
.trio { display: grid; gap: 1.25rem; }
@media (min-width: 820px) { .trio { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.trio > * { height: 100%; }
.trio .case-visual,
.trio .post-visual { flex: 0 0 auto; height: 9.5rem; max-height: none; min-height: 0; }

/* ==========================================================================
   v5 — capabilities, partners, careers, legal
   ========================================================================== */

/* --- capability tiles ---------------------------------------------------- */
.cap-group + .cap-group { margin-top: 4rem; }
.cap-group-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.5rem;
  flex-wrap: wrap;
  padding-bottom: 1.25rem;
  margin-bottom: 1.75rem;
  border-bottom: 1px solid var(--edge);
}
.cap-group-head h2 { font-size: clamp(1.5rem, 2.2vw, 2rem); }

.cap-tile { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
.cap-tile-media { height: 8rem; overflow: hidden; border-bottom: 1px solid var(--edge); flex: 0 0 auto; }
.cap-tile-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.3s var(--ease); }
.cap-tile:hover .cap-tile-media img { transform: scale(1.05); }
.cap-tile-body { padding: 1.6rem 1.6rem 1.75rem; display: flex; flex-direction: column; flex: 1; }
.cap-n {
  font-family: var(--f-display);
  font-size: 0.85rem;
  color: var(--gold-deep);
  unicode-bidi: isolate;
}
.cap-tile h3 { font-size: 1.12rem; line-height: 1.35; margin-block: 0.55rem 0.7rem; }
.cap-under {
  margin-top: auto;
  padding-top: 1.1rem;
  font-size: 0.7rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--gold);
}

.cap-callout {
  display: grid;
  gap: 1.5rem;
  align-items: center;
  margin-top: 3rem;
  padding: 2rem 2.2rem;
  border: 1px dashed var(--edge-2);
  border-radius: var(--r);
}
@media (min-width: 820px) {
  .cap-callout { grid-template-columns: minmax(0, 1fr) auto; gap: 3rem; }
}

/* The honest-advice block. Deliberately the loudest thing on a capability
   page — a page that only says yes is a price list. */
.counsel {
  margin-top: 2.25rem;
  padding: 1.6rem 1.75rem;
  border: 1px solid rgba(201, 169, 107, 0.28);
  background: var(--gold-wash);
  border-radius: var(--r);
}
.counsel p {
  font-family: var(--f-display);
  font-size: 1.08rem;
  line-height: 1.65;
  color: var(--paper);
}
[dir="rtl"] .counsel p { line-height: 1.9; }

.legacy-quote {
  border-inline-start: 2px solid var(--gold-deep);
  padding-inline-start: 1.25rem;
  font-family: var(--f-display);
  font-style: italic;
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--paper-dim);
}
[dir="rtl"] .legacy-quote { font-style: normal; }

/* --- partners ------------------------------------------------------------ */
.platform-grid { display: grid; gap: 1.25rem; }
@media (min-width: 640px) { .platform-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .platform-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.platform { padding: 1.7rem 1.5rem; height: 100%; }
.platform h3 { font-size: 1.1rem; }
.platform-area {
  font-size: 0.7rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--gold);
  margin-block: 0.45rem 0.85rem;
}

/* --- "we need this from you" ------------------------------------------- */
.needs-input {
  margin-top: 2rem;
  padding: 1.75rem 1.9rem;
  border: 1px dashed var(--edge-2);
  border-radius: var(--r);
  max-width: 46rem;
}
.needs-input b {
  display: block;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 0.7rem;
}
.needs-input p { color: var(--paper-dim); line-height: 1.7; font-size: 0.94rem; }

/* --- legal --------------------------------------------------------------- */
.review-notice {
  padding: 1.1rem 1.35rem;
  border-inline-start: 3px solid var(--gold);
  background: var(--gold-wash);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 0.88rem;
  line-height: 1.7;
  color: var(--paper-dim);
  margin-bottom: 2.75rem;
}
.legal-block { padding-block: 1.6rem; border-top: 1px solid var(--edge); }
.legal-block:first-of-type { border-top: 0; padding-top: 0; }
.legal-block h3 { font-size: 1.15rem; margin-bottom: 0.7rem; }

/* --- footer offices ------------------------------------------------------ */
.footer-offices {
  list-style: none;
  margin-top: 1.6rem;
  display: grid;
  gap: 0.5rem;
}
.footer-offices li { font-size: 0.82rem; color: var(--muted); }
.footer-offices span { color: var(--muted-2); unicode-bidi: isolate; }

/* ==========================================================================
   v6 — header matched to the live site

   Home · About Us · Services ▾ · Our Work · Blogs · Contact Us, then the CTA,
   then the language switch. Identical order to walqalum.com. The two pages the
   rebrand adds live inside the Services dropdown, which the live site already
   has, rather than as top-level items the client does not.
   ========================================================================== */

.logo-word {
  font-family: var(--f-sans);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 0.09em;
}

.nav { gap: 0.1rem; }
.nav-item { position: relative; }
.nav-item > a {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.5rem 0.7rem;
  font-size: 0.875rem;
  color: var(--paper-dim);
  border-radius: var(--r-sm);
  white-space: nowrap;
  transition: color 0.3s, background 0.3s;
}
.nav-item > a:hover,
.nav-item > a[aria-current="page"] {
  color: var(--paper);
  background: rgba(46, 47, 56, 0.6);
}
.chev { width: 0.6rem; height: 0.4rem; transition: transform 0.3s var(--ease); opacity: 0.7; }
.has-mega:hover .chev,
.has-mega.open .chev { transform: rotate(180deg); }

/* --- the dropdown -------------------------------------------------------- */
.mega {
  position: fixed;
  inset-inline: 0;
  top: 5rem;
  z-index: 90;
  background: rgba(20, 21, 26, 0.97);
  backdrop-filter: blur(20px) saturate(150%);
  border-block: 1px solid var(--edge);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition: opacity 0.35s var(--ease), transform 0.35s var(--ease), visibility 0.35s;
}
.has-mega:hover .mega,
.has-mega.open .mega,
.has-mega:focus-within .mega {
  opacity: 1;
  visibility: visible;
  transform: none;
}
.mega-inner {
  display: grid;
  gap: 3rem;
  padding-block: 2.5rem 2.75rem;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.75fr) minmax(0, 0.95fr);
}
.mega-col h4 {
  font-size: 0.66rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted-2);
  font-weight: 500;
  margin-bottom: 1.15rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid var(--edge);
}
.mega-col ul { list-style: none; display: grid; gap: 0.15rem; }
.mega-two { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 2.5rem; }
.mega-col li a {
  display: block;
  padding: 0.55rem 0.7rem;
  margin-inline: -0.7rem;
  border-radius: var(--r-sm);
  transition: background 0.25s;
}
.mega-col li a:hover { background: rgba(46, 47, 56, 0.55); }
.mega-col li b {
  display: block;
  font-family: var(--f-display);
  font-size: 0.98rem;
  font-weight: 400;
  color: var(--paper);
}
.mega-col li span {
  display: block;
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 0.2rem;
  line-height: 1.5;
}
.mega-col li a:hover b { color: var(--gold-bright); }

/* --- header actions in the live order: CTA, then language ---------------- */
.header-actions { gap: 0.75rem; }
.lang-switch { order: 2; }
.header-cta { order: 1; }

/* --- mobile menu groups -------------------------------------------------- */
.m-group { margin-top: 1.75rem; }
.m-group h4 {
  font-size: 0.66rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted-2);
  font-weight: 500;
  margin-bottom: 0.6rem;
}
.mobile-menu a.m-sub {
  font-family: var(--f-sans);
  font-size: 1rem;
  padding: 0.55rem 0;
  border-bottom: 0;
  color: var(--paper-dim);
}
.mobile-menu { overflow-y: auto; }

/* ==========================================================================
   v7 — responsive pass, 320px to 2560px

   Audited every route at sixteen widths. No horizontal overflow anywhere,
   but three real faults came out of it:
     · uppercase labels bottoming out at 9.9–10.9px, below the ~11.5px floor
       where letterspaced small caps stay comfortably legible;
     · standalone links (footer, rails, arrows, the logo) with 16–25px hit
       heights on touch, well under the 44px guideline;
     · nothing scaling above ~1280px, so a 2560px display showed a small page
       marooned in dark space.
   ========================================================================== */

/* --- 1. small-label floor ------------------------------------------------ */
.clients-label,
.case-meta,
.tag-proposed,
.footer-grid h4,
.fact > span,
.case-facts span,
.mega-col h4,
.m-group h4,
.needs-input b,
.feature-media .plate-label b,
.narr-label,
.eng-label,
.cap-under,
.practice-buyer,
.office .country,
.platform-area,
.eyebrow {
  font-size: 0.72rem;
}
.tag-proposed { font-size: 0.68rem; padding: 0.2rem 0.55rem; }
.stack-line,
.footer-offices li,
.office .tz { font-size: 0.78rem; }

/* --- 2. touch targets ---------------------------------------------------- */
@media (max-width: 899px) {
  .footer-grid ul a,
  .footer-bottom nav a,
  .rail .plain-link,
  .crumb a,
  .link-arrow,
  .mega-col li a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
  }
  .footer-grid ul { gap: 0; }
  .logo { min-height: 44px; }
  .lang-switch a { padding: 0.7rem 0.8rem; }
  .burger { width: 2.75rem; height: 2.75rem; }
  .chip span { padding: 0.6rem 1rem; }
  .field input,
  .field textarea { padding: 0.85rem 1rem; font-size: 1rem; } /* 16px stops iOS zooming on focus */
}

/* --- 3. the narrowest phones -------------------------------------------- */
@media (max-width: 380px) {
  .shell { padding-inline: 1.15rem; }
  .header-inner { gap: 0.6rem; height: 4.5rem; }
  .logo-word { font-size: 0.95rem; letter-spacing: 0.07em; }
  .logo-mark { width: 1.3rem; height: 1.3rem; }
  .lang-switch { font-size: 0.7rem; }
  .lang-switch a { padding: 0.6rem 0.5rem; }
  .hero-meta { gap: 1.25rem 1.25rem; }
  .hero-meta .k { font-size: 1.5rem; }
  .wide-body,
  .post-lg .post-body { padding: 1.5rem 1.25rem 1.65rem; }
  .case-body,
  .post-body,
  .cap-tile-body { padding: 1.35rem 1.25rem 1.5rem; }
  .form { padding: 1.5rem 1.25rem; }
  .metrics,
  .needs-input,
  .newsroom,
  .cap-callout { padding: 1.4rem 1.25rem; }
  .counsel { padding: 1.25rem 1.25rem; }
  .btn { padding: 0.9rem 1.3rem; font-size: 0.9rem; }
}

/* --- 4. large displays ---------------------------------------------------
   The measure stays sane; the type and the shell grow a little so the page
   does not read as a small site pinned to the middle of a big screen. */
@media (min-width: 1700px) {
  :root { --shell: 88rem; }
  html { font-size: 17px; }
}
@media (min-width: 2200px) {
  :root { --shell: 96rem; }
  html { font-size: 18px; }
  .display { font-size: clamp(6.6rem, 5vw, 8.2rem); }
}
/* The method strip is full-bleed, so on very wide screens its cells drift
   far apart from each other. Hold them to the shell. */
@media (min-width: 1700px) {
  .method {
    max-width: var(--shell);
    margin-inline: auto;
    border-inline: 1px solid var(--edge);
  }
}

/* --- v7.1: the specific offenders the diagnostic named ------------------- */
.band-cap span,
.eng-dur,
.tag-proposed,
.form legend,
.field > span { font-size: 0.74rem; }
.mock-note { font-size: 0.7rem; }

@media (max-width: 899px) {
  /* Links sitting inside a heading or a paragraph get their hit area from
     padding rather than from the type, which stays where it is. */
  .practice h3 > a.plain,
  .footer-brand p > a,
  .doc p > a.plain-link,
  .fact p > a,
  .fact p > a.plain-link {
    display: inline-block;
    padding-block: 0.7rem;
  }
  .mobile-menu a.m-sub { min-height: 44px; }
  .practice h3 { line-height: 1.5; }
}

/* --- v7.2: last of the touch targets ------------------------------------
   min-height does nothing on an inline box, which is why the first pass
   missed these. Flex or inline-block first, then the height. */
@media (max-width: 899px) {
  .mobile-menu a.m-sub {
    display: flex;
    align-items: center;
    min-height: 44px;
  }
  #main p > a,
  #main li > a:not(.btn),
  .site-footer p > a,
  .rail a:not(.btn),
  .crumb a {
    display: inline-block;
    padding-block: 0.65rem;
    line-height: 1.5;
  }
  .link-arrow,
  .footer-grid ul a,
  .footer-bottom nav a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding-block: 0;
  }
}

/* The language switch was the last one — 36px tall and 11.2px on the two
   narrowest phones. */
@media (max-width: 380px) {
  .lang-switch { font-size: 0.74rem; }
  .lang-switch a { padding: 0.75rem 0.55rem; }
}

/* --- the client's own logo ----------------------------------------------- */
.logo-img { height: 2.3rem; width: auto; display: block; }
@media (max-width: 380px) { .logo-img { height: 2rem; } }
.logo-fb { display: none; align-items: center; gap: 0.7rem; }
.logo-fallback .logo-img { display: none; }
.logo-fallback .logo-fb { display: flex; }
</style>

/* ==========================================================================
   WalQalum — hero atmosphere

   The revolving crystal is gone. However well it was rendered, a rotating 3D
   object in a hero is a product-launch gesture, not a consultancy one — and
   it kept pulling attention off the sentence that actually sells the firm.

   What replaces it is light, not an object: a slow warm field, domain-warped
   so it drifts like light through frosted glass. Low contrast on purpose. It
   should read as atmosphere behind the headline and never as a thing.

   Hand-written WebGL2, no dependency. Falls back to an animated CSS wash.
   ========================================================================== */

const HERO_VERT = `#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

const HERO_FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;
uniform float uSide;
uniform float uCompact;

float hash(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash(i + vec2(0,0)), hash(i + vec2(1,0)), u.x),
             mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
}

float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for(int i = 0; i < 3; i++){
    v += a * noise(p);
    p = rot * p * 2.02;
    a *= 0.5;
  }
  return v;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 p = (frag - 0.5*uRes) / uRes.y;

  // the light gathers on the side the type does not occupy
  p.x -= mix(0.38, 0.0, uCompact) * uSide;
  p += uMouse * 0.022;

  float t = uTime * 0.028;

  // domain warping — two rounds. This is what makes it drift like a fluid
  // instead of scrolling like a texture.
  vec2 q = vec2(fbm(p*0.72 + vec2(0.0, t)),
                fbm(p*0.72 + vec2(5.2, 1.3 - t)));
  vec2 r = vec2(fbm(p*0.85 + 2.2*q + vec2(1.7, 9.2) + 0.11*t),
                fbm(p*0.85 + 2.2*q + vec2(8.3, 2.8) - 0.09*t));
  float f = fbm(p*0.8 + 1.9*r);

  // Warm palette, deliberately narrow. Champagne highlight, graphite body,
  // one cooler note so it does not turn into amber soup.
  vec3 deep   = vec3(0.012, 0.012, 0.014);
  vec3 mid    = vec3(0.30, 0.225, 0.125);
  vec3 hot    = vec3(0.97, 0.80, 0.525);
  vec3 cool   = vec3(0.16, 0.18, 0.235);

  vec3 col = mix(deep, mid, smoothstep(0.30, 0.92, f));
  col = mix(col, hot, smoothstep(0.60, 1.0, f));
  col = mix(col, cool, smoothstep(0.40, 0.10, f) * 0.30);

  // a broad soft key so the field has a centre of gravity
  float key = exp(-length(p * vec2(0.85, 1.15)) * 1.45);
  col += vec3(0.60, 0.47, 0.30) * key * 0.95;

  // fade to nothing at the edges so it dissolves into the page
  float falloff = smoothstep(1.05, 0.02, length(p * vec2(0.82, 1.0)));
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  float alpha = clamp(falloff * lum * 2.5, 0.0, 1.0);

  col *= 1.15;
  col = col / (col + 0.92);
  col = pow(max(col, 0.0), vec3(0.4545));

  float n = fract(sin(dot(frag, vec2(12.9898, 78.233))) * 43758.5453);
  col += (n - 0.5) * 0.02;

  fragColor = vec4(col, alpha);
}`;

function initHero(canvas, opts = {}) {
  const gl = canvas.getContext("webgl2", {
    alpha: true,
    antialias: false,
    premultipliedAlpha: false,
    powerPreference: "low-power",
  });
  if (!gl) return false;

  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  };

  const vs = compile(gl.VERTEX_SHADER, HERO_VERT);
  const fs = compile(gl.FRAGMENT_SHADER, HERO_FRAG);
  if (!vs || !fs) return false;

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    return false;
  }
  gl.useProgram(prog);

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const U = {
    res: gl.getUniformLocation(prog, "uRes"),
    time: gl.getUniformLocation(prog, "uTime"),
    mouse: gl.getUniformLocation(prog, "uMouse"),
    side: gl.getUniformLocation(prog, "uSide"),
    compact: gl.getUniformLocation(prog, "uCompact"),
  };

  // A flow field carries no hard edges, so it can render very low and be
  // upscaled with no visible cost. Cheap enough for any laptop.
  const SCALE = opts.low ? 0.26 : 0.4;
  let W = 0, H = 0, compact = 0;

  function resize() {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (!cw || !ch) return;
    compact = cw < 860 ? 1 : 0;
    const nw = Math.max(2, Math.round(cw * SCALE));
    const nh = Math.max(2, Math.round(ch * SCALE));
    if (nw === W && nh === H) return;
    W = canvas.width = nw;
    H = canvas.height = nh;
    gl.viewport(0, 0, W, H);
  }
  resize();
  const ro = new ResizeObserver(resize);
  ro.observe(canvas);

  const m = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener(
    "pointermove",
    (e) => {
      m.tx = (e.clientX / window.innerWidth) * 2 - 1;
      m.ty = -((e.clientY / window.innerHeight) * 2 - 1);
    },
    { passive: true }
  );

  let visible = true;
  const io = new IntersectionObserver(([e]) => (visible = e.isIntersecting), { threshold: 0.01 });
  io.observe(canvas);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) visible = false;
  });

  const t0 = performance.now();
  let last = t0;
  let stopped = false;

  function frame(now) {
    if (stopped) return;
    requestAnimationFrame(frame);
    if (!visible) { last = now; return; }
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    const k = 1 - Math.pow(0.004, dt);
    m.x += (m.tx - m.x) * k;
    m.y += (m.ty - m.y) * k;

    resize();
    if (!W) return;

    gl.uniform2f(U.res, W, H);
    gl.uniform1f(U.time, (now - t0) / 1000);
    gl.uniform2f(U.mouse, m.x, m.y);
    gl.uniform1f(U.side, opts.rtl ? -1 : 1);
    gl.uniform1f(U.compact, compact);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);

  // The router destroys and recreates the hero on navigation.
  return () => {
    stopped = true;
    ro.disconnect();
    io.disconnect();
  };
}
