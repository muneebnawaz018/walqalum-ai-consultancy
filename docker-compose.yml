# MongoDB for the newsroom, run locally.
#
# This is the same thing a hosted cluster is: a mongod the app talks to over a
# connection string. Nothing in the code branches on where it lives, so moving
# to Atlas later is a change to MONGODB_URI and nothing else.
#
# Credentials come from .env.local so none of them are committed. Start it with
# `npm run db:up`, which passes that file through.
services:
  mongo:
    image: mongo:7
    container_name: walqalum-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      # Loopback only. The container is not reachable from the network.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
